server {
    listen 88;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：所有找不到的路徑都交給 index.html 處理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：前端呼叫 /api 時轉發到後端
    # BACKEND_URL 由容器啟動時透過 envsubst 注入（來自 .env）
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 反向代理：PPT 下載連結也轉發到後端
    location /downloads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
    }
}