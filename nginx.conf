# ======================================================
# Block 1：HTTP → HTTPS 強制重導，消除明碼傳輸風險
# ======================================================
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ======================================================
# Block 2：HTTPS 主服務（TLS 1.2 / 1.3）
# ======================================================
server {
    listen 443 ssl;
    server_name _;

    # --- SSL 憑證 ---
    # 測試環境：Dockerfile 產生的自簽憑證
    # 正式（GCP）：掛載 Let's Encrypt / GCP Managed Certificate
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 僅允許現代協議，禁用 SSLv3 / TLS 1.0 / TLS 1.1
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- 安全標頭 ---
    # HSTS：告知瀏覽器未來兩年內只用 HTTPS 連線
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # 禁止被 iframe 嵌入（防 Clickjacking）
    add_header X-Frame-Options DENY always;
    # 禁止瀏覽器 MIME 嗅探（防 Content Sniffing）
    add_header X-Content-Type-Options nosniff always;
    # 控制 Referer 資訊不洩漏後端路徑
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：所有找不到的路徑都交給 index.html 處理
    # index.html 必須禁止快取，否則瀏覽器會用舊 HTML 載入舊 JS bundle，
    # 導致程式碼更新後使用者仍執行舊版本。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Build-Id "BNwkWXbA" always;

        # 用 sub_filter 在 index.html 注入版本檢查腳本：
        # 若瀏覽器從快取載入了舊 HTML（不含此段腳本），
        # 自然不會執行任何額外邏輯。
        # 若載入新 HTML，此腳本會在頁面上記錄版本標記供偵錯用。
        sub_filter '</head>' '<script>window.__BUILD_ID__="BNwkWXbA";console.log("%c[BUILD] index.html v=BNwkWXbA loaded","color:lime;font-size:20px");</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # 靜態資源 (JS/CSS)：Vite 產出的檔名含 content hash，可安全長期快取
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # 反向代理：前端呼叫 /api 時轉發到後端
    # BACKEND_URL 由容器啟動時透過 envsubst 注入（來自 .env）
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁止瀏覽器快取 API 回應：
        # /api/v1/students/me 等端點依靠 Header 區分身分，URL 相同但回應不同，
        # 若瀏覽器快取會導致換帳號時仍回傳舊資料，繞過登入驗證。
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 反向代理：PPT 下載連結也轉發到後端
    location /downloads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}