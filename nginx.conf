server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：所有找不到的路徑都交給 index.html 處理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：前端呼叫 /api 時轉發到後端容器
    location /api/ {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 反向代理：PPT 下載連結也轉發到後端
    location /downloads/ {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
    }
}
